services:
  - type: web
    name: cleanz24-backend
    env: node
    plan: free
    rootDir: CLeanz24_backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_PHONE
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FAST2SMS_API_KEY
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: GOOGLE_SHEETS_URL
        sync: false
      - key: GOOGLE_SHEETS_SCRIPT_URL
        sync: false
      - key: GOOGLE_SHEETS_FRANCHISE_SCRIPT_URL
        sync: false
